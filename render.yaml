services:
  - type: web
    name: nova-builder-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run prisma:generate && npm run build -w @cms/shared && npm run build -w @cms/api
    startCommand: npm run prisma:deploy && npm run start -w @cms/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: LOCAL_UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: 25
      - key: DISABLE_TELEMETRY
        value: "true"
      - key: DISABLE_ANALYTICS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_PEPPER
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WEB_PUBLIC_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false

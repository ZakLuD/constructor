services:
  postgres:
    image: postgres:16-alpine
    container_name: sitebuilder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitebuilder
      POSTGRES_PASSWORD: sitebuilder
      POSTGRES_DB: sitebuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitebuilder -d sitebuilder"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sitebuilder-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sitebuilder:sitebuilder@postgres:5432/sitebuilder?schema=public
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sitebuilder-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
